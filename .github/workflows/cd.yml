name: 🚀 Continuous Deployment

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:
    inputs:
      environment:
        description: Select the environment to deploy.
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: self-hosted
    timeout-minutes: 15

    permissions:
      contents: read

    environment: ${{ github.event.inputs.environment || 'dev' }}

    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}

    concurrency:
      group: nubank-training-${{ github.event.inputs.environment || 'dev' }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # ------------------------------------------------------------------
      # Checkout Repository
      # ------------------------------------------------------------------
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Generate temporary environment file
      # ------------------------------------------------------------------
      - name: 📝 Generate Environment File
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .github/docker/env
          ENV_FILE=".github/docker/env/.env.${TARGET_ENV}"

          cat > "$ENV_FILE" <<EOF
          ENV_NAME=${TARGET_ENV}
          APP_VERSION=1.0.0-SNAPSHOT
          SONAR_HOST_URL=${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN=${{ secrets.SONAR_TOKEN }}
          EOF

          echo "✅ Environment file generated"
          echo "📄 File: $ENV_FILE"

      # ------------------------------------------------------------------
      # Normalize deploy script
      # ------------------------------------------------------------------
      - name: 🛠️ Prepare Deploy Script
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/\r$//' .github/docker/scripts/deploy.sh
          sed -i '1s/^\xEF\xBB\xBF//' .github/docker/scripts/deploy.sh

          chmod +x .github/docker/scripts/deploy.sh

      # ------------------------------------------------------------------
      # Build Project & Verify Compilation
      # ------------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 🔨 Build & Test Project
        run: |
          mvn clean test-compile surefire:test

      # ------------------------------------------------------------------
      # Execute SonarQube Analysis
      # ------------------------------------------------------------------
      - name: 🔍 Run SonarQube Analysis
        shell: bash
        run: |
          set -euo pipefail

          echo "📥 Starting SonarQube analysis for nubank-training-${TARGET_ENV}..."

          docker run --rm \
            --network "apex-network-${TARGET_ENV}" \
            -v "${{ github.workspace }}:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey="nubank-training-${TARGET_ENV}" \
            -Dsonar.projectName="Nubank Training (${TARGET_ENV^^})" \
            -Dsonar.sources=/usr/src/src/main/java \
            -Dsonar.java.binaries=/usr/src/target/classes \
            -Dsonar.host.url="${{ vars.SONAR_HOST_URL }}" \
            -Dsonar.token="${{ secrets.SONAR_TOKEN }}"

      # ------------------------------------------------------------------
      # Execute deployment
      # ------------------------------------------------------------------
      - name: 🚀 Deploy Stack
        shell: bash
        run: |
          set -euo pipefail

          ./.github/docker/scripts/deploy.sh "${TARGET_ENV}"

      # ------------------------------------------------------------------
      # Deployment summary
      # ------------------------------------------------------------------
      - name: 📋 Deployment Summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "- Environment: ${TARGET_ENV}"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Runner: ${RUNNER_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Cleanup temporary files
      # ------------------------------------------------------------------
      - name: 🧹 Cleanup Temporary Files
        if: always()
        shell: bash
        run: |
          rm -f ".github/docker/env/.env.${TARGET_ENV}"